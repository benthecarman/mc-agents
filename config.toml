# mc-agents configuration. Secrets do not go here: name the environment
# variable that holds a key in `api_key_env` and put the key in `.env`.

[llm]
# "openai" = any OpenAI-compatible endpoint, "anthropic" = Anthropic API.
kind = "openai"
base_url = "http://127.0.0.1:8888"
base_url_env = "MAPLE_BASE_URL"
# api_key_env = "OPENAI_API_KEY"
fast_model = "deepseek-v4-1-flash"
strong_model = "deepseek-v4-1-flash"
# Used when the model above fails (Maple sometimes runs out of capacity).
fallback_model = "deepseek-v4-1-flash-1017-uncensored"
fast_model_env = "MAPLE_MODEL"
strong_model_env = "MAPLE_MODEL"
# Extra request fields per tier. Low reasoning makes chat replies much faster.
fast_params = { reasoning_effort = "low" }

[server]
address = "localhost:25565"
# These need console access: set MC_CONSOLE in .env (see README).
# Real minutes per Minecraft day (vanilla 20). Shorter = dusk comes sooner.
day_minutes = 10
# Run once at startup. One sleeping bot skips the night; death drops items.
on_start = [
    "gamerule players_sleeping_percentage 0",
    "gamerule keep_inventory false",
]

[limits]
llm_calls_per_day = 60
inferences_per_turn = 6
skill_write_retries = 3
turn_timeout_secs = 180
# A bot with no goal for this long picks one that fits its personality.
# 0 = bots only do what players ask.
idle_goal_secs = 0
# The god bot acts unasked this often (0 = only when called by name).
god_whim_secs = 0
hardcore = false

